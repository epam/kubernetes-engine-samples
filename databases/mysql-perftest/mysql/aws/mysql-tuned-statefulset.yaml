apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-tuned
  namespace: mysql-tuned
  labels:
    app: mysql-app-tuned
spec:
  serviceName: mysql-svc-tuned
  replicas: 1
  selector:
    matchLabels:
      app: mysql-app-tuned
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  template:
    metadata:
      labels:
        app: mysql-app-tuned
    spec:
      securityContext:
        sysctls:
          - name: net.ipv4.tcp_fin_timeout
            value: "5"
      nodeSelector:
        app: mysql-app-tuned 
      tolerations:
        - key: "app"
          operator: "Equal"
          value: "mysql-app-tuned"
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - mysql-app-tuned
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: mysql-container
          image: mysql:8.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret-tuned
                  key: root-password
            - name: MYSQL_DATABASE
              value: test
            - name: MYSQL_USER
              value: bench_user
            - name: MYSQL_PASSWORD
              value: mysqlpass123
            - name: MYSQL_INITDB_SKIP_TZINFO
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: mysql-config
              mountPath: /etc/mysql/conf.d
            - name: ssl-certs
              mountPath: /etc/mysql/ssl/ca.pem
              subPath: ca.pem
            - name: ssl-certs
              mountPath: /etc/mysql/ssl/server-cert.pem
              subPath: server-cert.pem
            - name: ssl-certs
              mountPath: /etc/mysql/ssl/server-key.pem
              subPath: server-key.pem
          resources:
            # requests:
            #   memory: 100Gi
            #   cpu: "10"
            # limits:
            #   memory: 116Gi
            #   cpu: "15"
      volumes:
        - name: mysql-config
          configMap:
            name: mysql-config-tuned
        - name: ssl-certs
          secret:
            secretName: mysql-ssl-certs-tuned
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: balanced-storage-tuned
        resources:
          requests:
            storage: "500Gi"